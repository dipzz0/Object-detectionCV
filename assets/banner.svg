<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d1c" />
      <stop offset="50%" stop-color="#0b0813" />
      <stop offset="100%" stop-color="#06040a" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1" />
    </pattern>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  </style>

  <rect width="1200" height="360" fill="url(#bg)" />
  <rect width="1200" height="360" fill="url(#grid)" />
  <circle cx="920" cy="180" r="230" fill="url(#glow)" />
  <rect x="1" y="1" width="1198" height="358" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Left Column -->
  <g transform="translate(64, 0)">
    <g transform="translate(0, 52)">
      <rect width="254" height="26" rx="13" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#8b5cf6" />
      <text x="26" y="17" class="font-mono" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">YOLOV8 SOTA • 80 COCO CLASSES</text>
    </g>

    <g transform="translate(0, 126)">
      <text x="0" y="0" class="font-sans" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
        Object-DetectionCV
      </text>
    </g>

    <g transform="translate(0, 162)">
      <text x="0" y="0" class="font-sans" font-size="16.5" font-weight="400" fill="#94a3b8">
        Real-time multi-category object recognition and bounding box annotation.
      </text>
      <text x="0" y="24" class="font-sans" font-size="14" font-weight="400" fill="#64748b">
        End-to-end deep learning detection across 80 common object categories in Google Colab.
      </text>
    </g>

    <!-- Specs Pills -->
    <g transform="translate(0, 246)">
      <g transform="translate(0, 0)">
        <rect width="118" height="30" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="59" y="19" class="font-mono" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">Google Colab</text>
      </g>
      <g transform="translate(126, 0)">
        <rect width="128" height="30" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="64" y="19" class="font-mono" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">YOLOv8 Nano</text>
      </g>
      <g transform="translate(262, 0)">
        <rect width="134" height="30" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="67" y="19" class="font-mono" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">80 MS-COCO</text>
      </g>
      <g transform="translate(404, 0)">
        <rect width="118" height="30" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="59" y="19" class="font-mono" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">OpenCV 4.x</text>
      </g>
    </g>

    <g transform="translate(0, 308)">
      <text x="0" y="0" class="font-mono" font-size="11" fill="#475569">Single forward pass • Automated NMS &amp; class coloring • Zero configuration</text>
    </g>
  </g>

  <!-- Right Column: Minimalist Multi-Object Card -->
  <g transform="translate(680, 42)">
    <rect width="456" height="276" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 446 0 C 451.523 0 456 4.477 456 10 L 456 34 L 0 34 Z" fill="#0d131f" />
    <line x1="0" y1="34" x2="456" y2="34" stroke="#1e293b" stroke-width="1" />
    
    <circle cx="18" cy="17" r="4.5" fill="#ef4444" fill-opacity="0.75" />
    <circle cx="32" cy="17" r="4.5" fill="#f59e0b" fill-opacity="0.75" />
    <circle cx="46" cy="17" r="4.5" fill="#10b981" fill-opacity="0.75" />
    
    <text x="228" y="21" class="font-mono" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">yolov8.detect // multi_class_coco</text>

    <g transform="translate(24, 52)">
      <!-- Left Visual: Multi-Class Detection Scene Frame -->
      <g transform="translate(0, 0)">
        <rect width="210" height="186" rx="8" fill="#080c14" stroke="#172033" stroke-width="1" />
        
        <!-- Bounding Box 1: Car (Blue) -->
        <rect x="20" y="58" width="105" height="76" rx="3" fill="none" stroke="#38bdf8" stroke-width="1.8" />
        <rect x="20" y="44" width="56" height="14" rx="2" fill="#38bdf8" />
        <text x="24" y="54" class="font-mono" font-size="8" font-weight="700" fill="#040c14">CAR 94%</text>

        <!-- Bounding Box 2: Person (Violet) -->
        <rect x="135" y="28" width="55" height="106" rx="3" fill="none" stroke="#8b5cf6" stroke-width="1.8" />
        <rect x="135" y="14" width="55" height="14" rx="2" fill="#8b5cf6" />
        <text x="138" y="24" class="font-mono" font-size="8" font-weight="700" fill="#ffffff">PERSON 89%</text>

        <!-- Bounding Box 3: Dog (Green) -->
        <rect x="55" y="112" width="60" height="42" rx="3" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 2" />
        <text x="58" y="108" class="font-mono" font-size="7.5" font-weight="700" fill="#10b981">DOG 91%</text>

        <!-- Status Tag -->
        <rect x="20" y="156" width="170" height="18" rx="4" fill="#150f24" stroke="#8b5cf6" stroke-width="0.8" />
        <text x="105" y="168" class="font-mono" font-size="8.5" font-weight="700" fill="#a78bfa" text-anchor="middle">DETECTIONS: 3 OBJECTS</text>
      </g>

      <!-- Right Telemetry Metrics -->
      <g transform="translate(226, 0)">
        <!-- Metric 1: Categories -->
        <g transform="translate(0, 0)">
          <rect width="182" height="54" rx="6" fill="#080c14" stroke="#172033" stroke-width="1" />
          <text x="14" y="20" class="font-mono" font-size="9" font-weight="600" fill="#64748b">RECOGNIZED CLASSES</text>
          <text x="14" y="44" class="font-sans" font-size="20" font-weight="800" fill="#ffffff">80 <tspan font-size="11" font-weight="600" fill="#8b5cf6">COCO</tspan></text>
        </g>

        <!-- Metric 2: Speed -->
        <g transform="translate(0, 64)">
          <rect width="182" height="54" rx="6" fill="#080c14" stroke="#172033" stroke-width="1" />
          <text x="14" y="20" class="font-mono" font-size="9" font-weight="600" fill="#64748b">INFERENCE SPEED</text>
          <text x="14" y="44" class="font-sans" font-size="20" font-weight="800" fill="#ffffff">12.8 <tspan font-size="11" font-weight="600" fill="#38bdf8">MS</tspan></text>
        </g>

        <!-- Metric 3: Pipeline -->
        <g transform="translate(0, 128)">
          <rect width="182" height="58" rx="6" fill="#080c14" stroke="#172033" stroke-width="1" />
          <text x="14" y="20" class="font-mono" font-size="9" font-weight="600" fill="#64748b">ANNOTATION ENGINE</text>
          <text x="14" y="42" class="font-mono" font-size="12" font-weight="700" fill="#10b981">RESULTS.PLOT() NMS</text>
        </g>
      </g>
    </g>
  </g>
</svg>
